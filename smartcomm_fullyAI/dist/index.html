<!doctype html>
<html lang="en-SG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Proactive, Compact Commuter Companion For Singapore Commuters.">
  <title>SmartComm · Smart Commuter Companion</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/leaflet/leaflet.js" defer></script>
  <script src="data/network.js" defer></script>
  <script src="geo.js" defer></script>
  <script src="planner.js" defer></script>
  <script src="session.js" defer></script>
  <script src="web.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip To Your Commute</a>
  <div class="prototype-strip">
    <div class="shell prototype-shell">
      <span>SmartComm Companion · Intelligent Decision Support</span>
      <span>Singapore · Live Network</span>
    </div>
  </div>
  <header class="header">
    <div class="shell header-inner">
      <a class="brand" href="#today" aria-label="SmartComm Home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 17V7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v10M6 11h12M9 20l2-3m4 3-2-3M8 17h8"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/></svg>
        </span>
        SmartComm<span class="brand-period">.</span>
      </a>
      <nav class="desktop-nav" aria-label="Main Navigation">
        <button data-nav="today" class="active">Today</button>
        <button data-nav="commute">My Commute</button>
        <button data-nav="updates">Updates <span class="count" id="update-count" hidden>0</span></button>
      </nav>
      <div class="header-actions">
        <button class="header-notify-btn" data-action="notify" aria-label="Enable Push Notifications" title="Notifications">
          <span data-icon="bell"></span>
        </button>
        <button class="profile-button" data-action="edit" aria-label="Edit Commute Preferences">
          <span id="profile-avatar">R</span>
          <span class="profile-name" id="profile-name">Rachel</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="shell" tabindex="-1">
    <div class="page-heading">
      <div>
        <p class="eyebrow" id="eyebrow">YOUR COMMUTE</p>
        <h1 id="page-title">Your Next Journey</h1>
        <p id="page-description"></p>
      </div>
      <button class="mode-button" data-action="mode" aria-label="Change Feed Mode">
        <span id="mode-label">Official Feeds</span>
        <span aria-hidden="true">⌄</span>
      </button>
    </div>

    <p id="replan-status" class="sr-only" role="status" aria-live="polite"></p>

    <!-- Today View: Horizontal Map on Top of Your Next Journey -->
    <section id="today-view" aria-label="Today's Journey"></section>
    <section id="commute-view" hidden aria-label="Saved Commute Settings"></section>
    <section id="updates-view" hidden aria-label="Journey Updates Log"></section>

    <footer class="footer">
      <span>© OpenStreetMap Contributors · ODbL 1.0</span>
      <button class="text-button" data-action="about">About SmartComm</button>
    </footer>
  </main>

  <nav class="mobile-nav" aria-label="Mobile Navigation">
    <button data-nav="today" class="active"><span data-icon="home"></span>Today</button>
    <button data-nav="commute"><span data-icon="route"></span>My Commute</button>
    <button data-nav="updates"><span data-icon="bell"></span>Updates</button>
  </nav>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading">
      <h2 id="dialog-title"></h2>
      <button class="icon-button" id="close-dialog" aria-label="Close Dialog">✕</button>
    </div>
    <div id="dialog-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="shell">Enable JavaScript To Use The Commute Planner.</p></noscript>
</body>
</html>
